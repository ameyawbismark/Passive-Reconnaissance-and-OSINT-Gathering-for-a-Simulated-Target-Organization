<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Portal Login — Meridian Cove Logistics</title>
<meta name="generator" content="MCL-Portal v2.3 (internal build)">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F2436; --orange:#C1560E; --steel:#5B6B76; --paper:#F2EFE9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:var(--paper);
    font-family:'Inter',sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .panel{
    background:#fff;
    border:1px solid rgba(15,36,54,0.12);
    border-radius:2px;
    padding:44px 40px;
    max-width:400px;
    width:100%;
  }
  .logo{
    display:flex; align-items:center; gap:10px;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px;
    color:var(--ink); margin-bottom:6px; text-decoration:none;
  }
  .logo-mark{
    width:18px;height:18px; background:var(--orange);
    clip-path:polygon(0 20%,50% 0,100% 20%,100% 80%,50% 100%,0 80%);
    flex:none;
  }
  .sub{ font-size:13px; color:var(--steel); margin-bottom:32px; font-family:'IBM Plex Mono',monospace; }
  label{ display:block; font-size:13px; font-weight:500; color:var(--ink); margin-bottom:6px; }
  input{
    width:100%; padding:11px 12px; margin-bottom:18px;
    border:1px solid rgba(15,36,54,0.2); border-radius:2px;
    font-family:'Inter',sans-serif; font-size:14px;
  }
  button{
    width:100%; padding:12px; background:var(--ink); color:var(--paper);
    border:none; border-radius:2px; font-weight:500; font-size:14.5px;
    cursor:not-allowed; opacity:0.85;
  }
  .notice{
    margin-top:18px; font-size:12px; color:var(--steel);
    font-family:'IBM Plex Mono',monospace; text-align:center;
  }
  .back{ display:block; text-align:center; margin-top:14px; font-size:13px; color:var(--steel); text-decoration:none; }
</style>
</head>
<body>
  <div class="panel">
    <a href="/" class="logo"><span class="logo-mark"></span>Meridian Cove</a>
    <div class="sub">CUSTOMER TRACKING PORTAL — v2.3</div>
    <form onsubmit="return false;">
      <label for="u">Account email</label>
      <input type="email" id="u" placeholder="you@company.com" autocomplete="off">
      <label for="p">Password</label>
      <input type="password" id="p" placeholder="••••••••" autocomplete="off">
      <button type="submit" disabled>Sign in</button>
    </form>
    <div class="notice">SIMULATED PAGE — NOT A FUNCTIONAL LOGIN — ACADEMIC OSINT EXERCISE</div>
    <a href="/" class="back">&larr; Back to main site</a>
  </div>
</body>
</html>
